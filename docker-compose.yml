services:
  db:
    image: postgres:16
    container_name: dofus_db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Periodic pg_dump of the whole database into ./backups on the host.
  #
  # Starts by default, on purpose. The captured tables are observations of a
  # live server and cannot be refetched: `item_stats` describes item instances
  # the crush destroyed, so nothing else ever recorded them. A deleted volume
  # takes the lot, which has already happened here once with nothing to restore
  # from. A backup nobody has to remember to start is the only kind that helps.
  #
  # Same image as `db` so pg_dump's version always matches the server's; a
  # newer server than the client refuses outright.
  #
  # The host directory survives `docker compose down -v` and a volume deleted
  # in Docker Desktop, which is exactly the failure this is for.
  db-backup:
    image: postgres:16
    container_name: dofus_db_backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    networks:
      - db
    volumes:
      - ./backups:/backups
      - ./tools/backup_db.sh:/tools/backup_db.sh:ro
      - ./tools/restore_db.sh:/tools/restore_db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    # One dump immediately on start, then every BACKUP_INTERVAL seconds. Taking
    # one at startup matters: bringing the stack up after a crash is exactly
    # when you want a known-good copy before anything else touches the data.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /tools/backup_db.sh || echo "[backup] run failed, will retry"
          sleep "$${BACKUP_INTERVAL:-3600}"
        done

  pgadmin:
    image: dpage/pgadmin4
    container_name: dofus_pgadmin
    restart: always
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    networks:
      - db
    depends_on:
      - db

  # Next.js front end. Reads the database the sniffer fills; it never captures
  # traffic, so it does not need the game running or any special privileges.
  #
  # This runs a production build. For day-to-day work use `cd web && pnpm dev`
  # on the host — it starts in under a second, where this has to build first.
  web:
    build: ./web
    container_name: dofus_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # `db` is the compose service name — inside the network that is the host,
      # NOT localhost, which would be the container itself.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy
    # Deliberately NOT watched. This is the production build; auto-rebuilding
    # it on every keystroke is slow and was firing during development. To
    # refresh it after changes:  docker compose up -d --build web

  # Hot-reload development container. Not started by default:
  #     docker compose --profile dev watch
  #
  # compose watch syncs changed files straight into the running container, so
  # Next's HMR picks them up with no rebuild. Runs on 3001 to stay clear of the
  # production `web` service and a host `pnpm dev`, both of which want 3000.
  #
  # Fastest option is still `cd web && pnpm dev` on the host — native HMR, no
  # file syncing. This exists for parity with how it runs deployed.
  web-dev:
    build:
      context: ./web
      target: dev
    container_name: dofus_web_dev
    profiles: ["dev"]
    ports:
      - "${WEB_DEV_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # sync = copy the changed file in; HMR reacts. No rebuild.
        - action: sync
          path: ./web/src
          target: /app/src
        - action: sync
          path: ./web/design
          target: /app/design
        - action: sync
          path: ./web/public
          target: /app/public
        # dependency changes need the image rebuilt, not just a file copy
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/pnpm-lock.yaml

  # Packet capture, LINUX ONLY.
  #
  # Not started by default — bring it up with:
  #     docker compose --profile capture up -d sniffer
  #
  # It needs the real network interface, so it runs with network_mode: host and
  # CAP_NET_RAW. On macOS and Windows that host is Docker's Linux VM, not your
  # machine: the container sees a virtual network with no game traffic on it and
  # will sit there capturing nothing. Run the binary natively there instead:
  #     cd sniffer && cargo build && ./target/debug/SniffSniffSquared --dev en0 ...
  #
  # DOFUS_DEV must name an interface that exists inside the container (eth0,
  # ens18, ...), not one from `ifconfig` on a Mac.
  sniffer:
    build: ./sniffer
    container_name: dofus_sniffer
    profiles: ["capture"]
    restart: unless-stopped
    # host networking so the capture sees real traffic; it also puts postgres
    # on localhost, which is why this does not join the `db` network
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      DOFUS_DEV: ${DOFUS_DEV:-eth0}
      ARCHIVE_PACKETS: ${ARCHIVE_PACKETS:-1}
    volumes:
      # editable without a rebuild — these are the files to change when a game
      # update rotates the message keys or moves their field numbers (see README)
      - ./sniffer/keymap.json:/app/keymap.json:ro
      - ./sniffer/schema.json:/app/schema.json:ro
    command: ["--all", "${BPF_FILTER:-tcp port 5555}"]
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./sniffer/src
        - action: rebuild
          path: ./sniffer/Cargo.toml
        # both are bind-mounted, so a rotated key or a moved field number
        # needs only a restart
        - action: restart
          path: ./sniffer/keymap.json
        - action: restart
          path: ./sniffer/schema.json

volumes:
  db_data:

networks:
  db:
