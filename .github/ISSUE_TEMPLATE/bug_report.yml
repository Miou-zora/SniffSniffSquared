name: Bug report
description: Something is broken, wrong, or decodes to nonsense.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: the [README troubleshooting table](https://github.com/Miou-zora/SniffSniffSquared#troubleshooting)
        covers the common causes, and a game update that rotates the wire keys is
        **not a bug** — use the *Client build update* template for that.

        **Security problems do not go here.** Report them privately, per
        [SECURITY.md](https://github.com/Miou-zora/SniffSniffSquared/blob/main/SECURITY.md).

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - sniffer/ — capture, deframing, decoding
        - web/ — the dashboard
        - tools/ — the Python scripts
        - docker compose / database
        - docs (README, RUNBOOK, blog)
        - not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        The exact commands, from which directory. The Rust app must be run from
        `sniffer/`, so say if you did.
      placeholder: |
        cd sniffer
        cargo build
        ./target/debug/SniffSniffSquared --dev en0 --all "tcp port 5555"
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        Paste the relevant output. For a capture problem, include the startup
        lines — the keymap, schema, `capturing on …` and whether `framing locked`
        ever appeared.

        **Redact other players first**: character names become `Player-Redacted-NN`,
        chat bodies become `<chat message text>`.
      render: text

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: input
    id: client_build
    attributes:
      label: Client build
      description: |
        For anything protocol-related. A result without a build is not
        reproducible, because the keys and field numbers rotate between builds.
      placeholder: "2026-08-04"

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        OS:        macOS 15.5 (Apple Silicon) / Windows 11 + Npcap 1.79 / Ubuntu 24.04
        Rust:      rustc 1.9x.x
        Capture:   native binary / compose `sniffer` service (Linux only)
        Node/pnpm: only for web/ issues
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `cargo build` after the last change — `cargo test` alone does not rebuild the binary, and a stale binary has produced wrong conclusions here before.
        - label: My `.env` has `BPF_FILTER` **quoted** — unquoted, `dotenvy` silently drops every variable declared after it, including `DATABASE_URL`.
        - label: I have redacted other players' names and chat from everything above.
          required: true
